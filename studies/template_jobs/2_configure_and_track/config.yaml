# Configuration for tuning of the collider
config_collider:
  config_knobs_and_tuning:
    knob_settings:
      # Exp. configuration in IR1, IR2, IR5 and IR8***
      on_x1: 160.000
      on_sep1: 0.0   #-0.550
      phi_IR1: 0.0

      on_x2h: 0.000
      on_sep2h: -0.1 # -1.0  # 1.000
      on_x2v: 200.000
      on_sep2v: 0.000
      phi_IR2: 90.000

      on_x5: 160.000
      on_sep5: 0.0  # 0.550
      phi_IR5: -90.0

      on_x8h: 0.000
      on_sep8h: -0.00018 #-0.01   #-1.000
      on_x8v: 200.000
      on_sep8v: 0.000
      phi_IR8: 180.000

      # Spurious dispersion correction
      on_disp: 0.0

      # Magnets of the experiments
      on_alice_normalized: 1
      on_lhcb_normalized: -1
      on_sol_atlas: 0
      on_sol_cms: 0
      on_sol_alice: 0

      # RF voltage and phases
      vrf400: 12.0 # [MV]
      lagrf400.b1: 0.5 # [rad]
      lagrf400.b2: 0. # [rad]

      # Octupoles
      i_oct_b1: -300.0 #400. # [A]
      i_oct_b2: -300.0 #400. # [A]

    closed_orbit_correction:
      lhcb1: correction/corr_co_lhcb1.json
      lhcb2: correction/corr_co_lhcb2.json

    # Tunes and chromaticities
    qx:
      lhcb1: 62.31
      lhcb2: 62.31
    qy:
      lhcb1: 60.32
      lhcb2: 60.32
    dqx:
      lhcb1: 20.0
      lhcb2: 20.0
    dqy:
      lhcb1: 20.0
      lhcb2: 20.0

    # Linear coupling
    delta_cmr: 0.0
    delta_cmi: 0.0

    knob_names:
      lhcb1:
        q_knob_1: dqx.b1_sq
        q_knob_2: dqy.b1_sq
        dq_knob_1: dqpx.b1_sq
        dq_knob_2: dqpy.b1_sq
        c_minus_knob_1: c_minus_re_b1
        c_minus_knob_2: c_minus_im_b1
      lhcb2:
        q_knob_1: dqx.b2_sq
        q_knob_2: dqy.b2_sq
        dq_knob_1: dqpx.b2_sq
        dq_knob_2: dqpy.b2_sq
        c_minus_knob_1: cmrs.b2_sq #c_minus_re_b2
        c_minus_knob_2: cmis.b2_sq #c_minus_im_b2

  config_beambeam:
    skip_beambeam: false
    bunch_spacing_buckets: 10
    num_slices_head_on: 11
    num_long_range_encounters_per_side:
      ip1: 25
      ip2: 20
      ip5: 25
      ip8: 20
    sigma_z: 0.09
    num_particles_per_bunch: 230000000000.0
    nemitt_x: 1.8e-6
    nemitt_y: 1.8e-6
    asymmetric_emittance:
      lhcb1: 1.8e-6
      lhcb2: 1.8e-6
    asymmetric_intensity:
      lhcb1: 160000000000.0  # Will be set later
      lhcb2: 160000000000.0  # Will be set later
    mask_with_filling_pattern:
      #pattern_fname: ../filling_scheme/25ns_2352b_2340_2004_2133_108bpi_24inj_converted.json
      pattern_fname: ../filling_scheme/25ns_2460b_2448_2089_2227_144bpi_20inj_fill10709.json
      i_bunch_b1: 83 # If not specified, the bunch with the worst schedule is chosen
      i_bunch_b2: 80 # Same. A value for i_bunch_b1 and i_bunch_b2 must be specified if pattern_fname is specified
    damper_on: false

    luminosity_ip1_without_beam_beam: 2.9840302973830314e+34
    Pile-up_ip1_without_beam_beam: 87.80072191940116
    luminosity_ip2_without_beam_beam: 6.378562620654894e+31
    Pile-up_ip2_without_beam_beam: 0.21993313027130945
    luminosity_ip5_without_beam_beam: 2.984157501024695e+34
    Pile-up_ip5_without_beam_beam: 87.80446470029003
    luminosity_ip8_without_beam_beam: 1.5081615631610067e+34
    Pile-up_ip8_without_beam_beam: 48.77911573218255
    luminosity_ip1_with_beam_beam: 3.1188902042435486e+34
    Pile-up_ip1_with_beam_beam: 91.76877720044871
    luminosity_ip2_with_beam_beam: 6.431076909055809e+31
    Pile-up_ip2_with_beam_beam: 0.22174382533207185
    luminosity_ip5_with_beam_beam: 3.1241710237902923e+34
    Pile-up_ip5_with_beam_beam: 91.92415758279161
    luminosity_ip8_with_beam_beam: 1.5485276203857143e+34
    Pile-up_ip8_with_beam_beam: 50.08469241913178
  config_lumi_leveling_ip1_5:
    skip_leveling: false
    luminosity: 2.1e+34
    num_colliding_bunches:      # This will be set automatically according to the filling scheme
    vary:
    - num_particles_per_bunch
    constraints:
      max_intensity: 2.3e11 # 230000000000.0 #1.8e11
      max_PU: 70

  skip_leveling: false
  config_lumi_leveling:
    ip2:
      separation_in_sigmas: 5
      plane: x
      impose_separation_orthogonal_to_crossing: false
      knobs:
      - on_sep2h
      - on_sep2v
      bump_range:
        lhcb1:
        - e.ds.l2.b1
        - s.ds.r2.b1
        lhcb2:
        - s.ds.r2.b2
        - e.ds.l2.b2
      preserve_angles_at_ip: true
      preserve_bump_closure: true
      corrector_knob_names:
        # to preserve angles at ip
      - corr_co_acbyvs4.l2b1
      - corr_co_acbyhs4.l2b1
      - corr_co_acbyvs4.r2b2
      - corr_co_acbyhs4.r2b2
          # to close the bumps
      - corr_co_acbyvs4.l2b2
      - corr_co_acbyhs4.l2b2
      - corr_co_acbyvs4.r2b1
      - corr_co_acbyhs4.r2b1
      - corr_co_acbyhs5.l2b2
      - corr_co_acbyvs5.l2b2
      - corr_co_acbchs5.r2b1
      - corr_co_acbcvs5.r2b1
    ip8:
      luminosity: 2.0e+33
      num_colliding_bunches:      # This will be set automatically according to the filling scheme
      impose_separation_orthogonal_to_crossing: true
      knobs:
      - on_sep8h
      - on_sep8v
      constraints:
      - x_lhcb1_<_0_ip8
      # - x_lhcb2_>_0_ip8
      # - y_lhcb1_>_0_ip8
      # - y_lhcb2_<_0_ip8
      bump_range:
        lhcb1:
        - e.ds.l8.b1
        - s.ds.r8.b1
        lhcb2:
        - s.ds.r8.b2
        - e.ds.l8.b2
      preserve_angles_at_ip: true
      preserve_bump_closure: true
      corrector_knob_names:
        # to preserve angles at ip
      - corr_co_acbyvs4.l8b1
      - corr_co_acbyhs4.l8b1
      - corr_co_acbyvs4.r8b2
      - corr_co_acbyhs4.r8b2
          # to close the bumps
      - corr_co_acbyvs4.l8b2
      - corr_co_acbyhs4.l8b2
      - corr_co_acbyvs4.r8b1
      - corr_co_acbyhs4.r8b1
      - corr_co_acbcvs5.l8b2
      - corr_co_acbchs5.l8b2
      - corr_co_acbyvs5.r8b1
      - corr_co_acbyhs5.r8b1

config_simulation:
  # Collider file
  collider_file: ../collider.json.zip

  # Distribution in the normalized xy space
  particle_file: ../particles/00.parquet

  # Initial off-momentum
  delta_max: 27.e-5

 # Exciter
  amplitude: 1.
  frequency: 3000. #300.
  phi: 0.
  sampling_frequency: 11245.5
  #knl: 0.0000000006 #0.000012 
  knl: 1. #0.000012 
  index: mb.b9r3.b1  # bpmcs.7l4.b1 # mb.b9r3.b1 ##mq.11r3.b1 #mq.11r3.b1 # 'mq.7r3.b1..1_exit' #quadrupole  #'mb.b9r3.b1' #dipole
  std_dev: 1e-8 # 9e-9rad  # Standard deviation of the white noise
  white_noise: true
  ripple_noise: false
  #noise_file_A : /afs/cern.ch/work/a/aradosla/private/example_DA_study_50Hz/studies/scripts/corrected_A.txt #/afs/cern.ch/work/a/aradosla/private/example_DA_study_50Hz/studies/scripts/noise_file_A.txt
  #noise_file_f: /afs/cern.ch/work/a/aradosla/private/example_DA_study_50Hz/studies/scripts/noise_file_f.txt
  noise_file_A: 
    /afs/cern.ch/work/a/aradosla/private/example_DA_study_50Hz_parallel/studies/scripts/noise_file_A_FLATTOP120cm1.txt              #/afs/cern.ch/work/a/aradosla/private/example_DA_study_50Hz/studies/scripts/noise_file_A.txt
  noise_file_f: 
    /afs/cern.ch/work/a/aradosla/private/example_DA_study_50Hz_parallel/studies/scripts/noise_file_f_FLATTOP120cm.txt

  # Tracking
  n_turns: 1000000 # number of turns to track

  # Beam to track
  beam: lhcb1   #lhcb1 or lhcb2
  tol_qx: 0.0001
  tol_qy: 0.0001
  tol_dqx: 0.05
  tol_dqy: 0.05
  tol_cminus: 1e-3


dump_collider: true
dump_config_in_collider: true

# Context for the simulation
context: cpu # opencl

# Device number for GPU simulation
device_number: # 0

# Log
log_file: tree_maker.log


